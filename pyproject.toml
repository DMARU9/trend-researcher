[project]
name = "trend-researcher"
version = "0.1.0"
description = "Trend Researcher - 自然言語指示から自律的に X（Twitter）/ YouTube のトレンドリサーチレポートを生成する統合 CLI ツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "twscrape>=0.20.0",
    "yt-dlp>=2024.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    # 構造解析ツール（script/analyze_structure.py）
    "pylint>=3.0.0",   # pyreverse
    "pydeps>=1.12.0",
    "radon>=6.0.0",
    # LangGraph Studio（Web UI）
    "langgraph-cli[inmem]>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_researcher"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "twscrape"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yt_dlp"
ignore_missing_imports = true
